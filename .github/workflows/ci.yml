name: Data Viewer quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-viewer-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  quality:
    name: ${{ matrix.name }} quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu
            os: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up CPython
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 libegl1 libgl1 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-xinerama0

      - name: Verify lock and install all locked dependencies
        run: |
          uv lock --check
          uv sync --locked --all-extras

      - name: Smoke-test direct dependencies
        run: >-
          uv run --locked python -c 'import PyQt6.QtCore, numpy, h5py, pandas, scipy, nibabel, openpyxl, yaml, matplotlib, jsonschema, platformdirs; print("direct-import-smoke: ok")'

      - name: Lint Data Viewer target and isolation harness
        run: >-
          uv run --locked ruff check data_viewer tests/conftest.py tests/test_data_viewer_package.py tests/test_test_environment.py

      - name: Type-check Data Viewer target
        run: uv run --locked mypy data_viewer

      - name: Compile target and legacy compatibility paths
        run: uv run --locked python -m compileall -q data_viewer core gui plugins services utils main.py

      - name: Collect tests
        run: uv run --locked python -m pytest --collect-only -q

      - name: Run full offscreen regression suite
        run: uv run --locked python -m pytest -q

      - name: Build source distribution and wheel
        run: uv build --no-sources --out-dir artifacts/${{ matrix.name }}

      - name: Prune CI cache
        if: always()
        run: uv cache prune --ci
