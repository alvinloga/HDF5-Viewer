name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name HDF5Viewer --onedir --windowed --noconfirm --clean ^
            --hidden-import PyQt6.QtWidgets ^
            --hidden-import PyQt6.QtCore ^
            --hidden-import PyQt6.QtGui ^
            --hidden-import PyQt6.sip ^
            --collect-submodules PyQt6 ^
            --collect-data PyQt6 ^
            --hidden-import h5py ^
            --collect-data h5py ^
            --hidden-import numpy ^
            --hidden-import numpy.core ^
            --hidden-import numpy.lib ^
            --hidden-import matplotlib ^
            --hidden-import matplotlib.backends.backend_qtagg ^
            --collect-data matplotlib ^
            --add-data "config.json;." ^
            main.py
        shell: cmd

      - name: Package distribution
        run: |
          Compress-Archive -Path dist\HDF5Viewer\* -DestinationPath HDF5Viewer-${{ env.VERSION }}-windows-x86_64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdf5-viewer-windows
          path: HDF5Viewer-${{ env.VERSION }}-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: python build.py --linux

      - name: Package distribution
        run: |
          cd dist
          tar czf HDF5Viewer-${{ env.VERSION }}-linux-x86_64.tar.gz HDF5Viewer/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdf5-viewer-linux
          path: dist/HDF5Viewer-${{ env.VERSION }}-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: hdf5-viewer-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: hdf5-viewer-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HDF5Viewer-${{ env.VERSION }}-windows-x86_64.zip
            HDF5Viewer-${{ env.VERSION }}-linux-x86_64.tar.gz
          generate_release_notes: true
