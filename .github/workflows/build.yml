name: Data Viewer release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  blocked:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Explain the remaining release block
        run: |
          echo "Data Viewer v1 release is intentionally blocked."
          echo "Windows and Ubuntu quality jobs passed before this job was eligible to run."
          echo "A publication workflow will be added only after v1 artifact smoke tests and the PyQt licensing decision are complete."
          exit 1
